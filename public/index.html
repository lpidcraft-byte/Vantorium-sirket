<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantorium Şirket</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg:#0a0b0d; --panel:#131519; --panel2:#1a1d23;
    --txt:#e8ecf1; --sub:#8a929e; --accent:#3b82f6;
    --green:#22c55e; --red:#ef4444; --border:#22262e;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}

  /* MATRIX BG */
  #matrix{position:fixed;inset:0;z-index:0;opacity:.25;pointer-events:none}

  /* VERIFY SCREEN */
  #verify{position:fixed;inset:0;z-index:100;background:rgba(10,11,13,.97);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  .verify-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:min(92vw,420px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .verify-box h1{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
  .verify-box .sub{color:var(--sub);font-size:12px;margin-bottom:22px;letter-spacing:.3px}
  .verify-box img{width:72px;height:72px;object-fit:contain;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(59,130,246,.4))}
  .verify-box .hint{color:var(--sub);font-size:13px;margin-bottom:14px}
  .verify-btn{width:100%;padding:14px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;font-weight:500;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}
  .verify-btn:hover{border-color:var(--accent);background:#1e2430}
  .verify-btn .box{width:18px;height:18px;border:2px solid var(--sub);border-radius:4px;transition:.2s}
  .verify-btn.done{border-color:var(--green);background:rgba(34,197,94,.1)}
  .verify-btn.done .box{background:var(--green);border-color:var(--green)}

  /* MAIN */
  #app{display:none;position:relative;z-index:2;min-height:100vh}
  header{background:rgba(19,21,25,.95);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.4px}
  .brand img{width:26px;height:26px;object-fit:contain}
  .top-notif{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);padding:12px 22px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:50;pointer-events:none;white-space:nowrap}
  .top-notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .top-notif.green{background:rgba(34,197,94,.15);border:1px solid var(--green);color:var(--green)}
  .top-notif.red{background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red)}

  main{max-width:1100px;margin:0 auto;padding:24px 18px}
  h2{font-size:18px;font-weight:600;margin-bottom:16px;letter-spacing:.3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;transition:.2s;cursor:pointer;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card h3{font-size:15px;font-weight:600;margin-bottom:6px}
  .card .meta{color:var(--sub);font-size:12px;margin-bottom:14px}
  .card .btn{width:100%;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-attack{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}
  .btn-attack:hover{background:var(--red);color:#fff}
  .btn-join{background:rgba(59,130,246,.15);color:var(--accent);border:1px solid var(--accent)}
  .btn-join:hover{background:var(--accent);color:#fff}

  /* TOP BAR (company) */
  .company-top{position:fixed;top:0;left:0;right:0;background:rgba(19,21,25,.98);border-bottom:1px solid var(--border);padding:12px 22px;display:none;align-items:center;justify-content:space-between;z-index:30}
  .company-top.show{display:flex}

  /* 3 dots menu */
  .dots{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
  .dots:hover{border-color:var(--accent)}
  .dots-menu{position:absolute;top:46px;right:12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:170px;z-index:6}
  .dots-menu.show{display:flex}
  .dots-menu button{background:transparent;border:none;color:var(--txt);padding:8px 10px;text-align:left;font-size:12px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .dots-menu button:hover{background:var(--panel)}
  .dots-menu .accept{color:var(--green)}
  .dots-menu .reject{color:var(--red)}

  /* ATTACK ANIMATION OVERLAY */
  #attack{position:fixed;inset:0;z-index:80;background:rgba(5,5,8,.96);display:none;overflow:hidden;font-family:monospace}
  #attack.show{display:block}
  #attack .matrix2{position:absolute;inset:0;overflow:hidden;opacity:.6}
  #attack .matrix2 span{position:absolute;color:#0f0;font-size:14px;animation:fall linear infinite;text-shadow:0 0 6px #0f0}
  @keyframes fall{from{transform:translateY(-100%)}to{transform:translateY(100vh)}}
  #attack .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10}
  #attack .menu h1{font-size:28px;letter-spacing:4px;color:#0f0;text-shadow:0 0 20px #0f0;margin-bottom:24px;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  #attack .menu button{padding:16px 44px;background:transparent;border:2px solid #0f0;color:#0f0;font-size:18px;letter-spacing:4px;font-weight:700;cursor:pointer;border-radius:6px;transition:.2s;text-shadow:0 0 10px #0f0;box-shadow:0 0 20px rgba(0,255,0,.3)}
  #attack .menu button:hover{background:#0f0;color:#000}
  #attack .result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:15;display:none}
  #attack .result.show{display:block}
  #attack .result h2{font-size:36px;letter-spacing:2px;font-weight:800;margin-bottom:14px}
  #attack .result.green h2{color:var(--green);text-shadow:0 0 30px var(--green)}
  #attack .result.red h2{color:var(--red);text-shadow:0 0 30px var(--red)}
  #attack .result p{color:var(--sub);font-size:14px;margin-bottom:20px}
  #attack .result button{padding:10px 30px;background:transparent;border:1px solid var(--sub);color:var(--txt);border-radius:6px;cursor:pointer;font-size:13px}

  /* Chat */
  .chat-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-top:18px;overflow:hidden}
  .chat-panel h3{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
  .chat-msgs{height:280px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .chat-msgs .msg{font-size:13px;line-height:1.4}
  .chat-msgs .msg b{color:var(--accent);margin-right:6px}
  .chat-input{display:flex;border-top:1px solid var(--border)}
  .chat-input input{flex:1;padding:12px 16px;background:transparent;border:none;color:var(--txt);font-size:13px;outline:none}
  .chat-input button{padding:0 20px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

  .hidden{display:none!important}
</style>
</head>
<body>

<!-- MATRIX BG -->
<canvas id="matrix"></canvas>

<!-- VERIFY SCREEN -->
<div id="verify">
  <div class="verify-box">
    <img src="/icon.png" alt="Vantorium" onerror="this.style.display='none'">
    <h1>Vantorium Şirket</h1>
    <div class="sub">GÜVENLİK DOĞRULAMASI</div>
    <p class="hint">Bot olmadığını doğrulamak için aşağıdaki kutucuğa bas.</p>
    <button class="verify-btn" id="verifyBtn">
      <span class="box"></span>
      <span>İnsan olduğumu doğrula</span>
    </button>
  </div>
</div>

<!-- TOP NOTIF -->
<div class="top-notif" id="topNotif"></div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="brand"><img src="/icon.png" onerror="this.style.display='none'"> Vantorium</div>
    <div style="font-size:12px;color:var(--sub)" id="meLabel">—</div>
  </header>

  <div class="company-top" id="companyTop">
    <div class="brand"><img src="/icon.png" onerror="this.style.display='none'"> <span id="ctName">Şirket</span></div>
    <button class="btn-join" style="width:auto;padding:8px 16px" onclick="backHome()">Geri</button>
  </div>

  <main id="home">
    <h2>Şirketler</h2>
    <div class="grid" id="companyGrid"></div>
  </main>

  <main id="companyView" class="hidden">
    <div id="companyDetail"></div>
    <div class="chat-panel">
      <h3>Sohbet</h3>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Mesaj yaz..." maxlength="300">
        <button onclick="sendChat()">Gönder</button>
      </div>
    </div>
  </main>
</div>

<!-- ATTACK OVERLAY -->
<div id="attack">
  <div class="matrix2" id="attackMatrix"></div>
  <div class="menu" id="attackMenu">
    <h1>ŞİRKET'E SIZ</h1>
    <button onclick="runAttack()">DENE</button>
  </div>
  <div class="result" id="attackResult">
    <h2 id="arTitle"></h2>
    <p id="arMsg"></p>
    <button onclick="closeAttack()">KAPAT</button>
  </div>
</div>

<script>
// ===== MATRIX BG =====
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
const chars = '01アイウエオカキクケコサシスセソVANTORIUMŞİRKET'.split('');
const cols = Math.floor(W/16), drops = Array(cols).fill(1);
function matrixLoop(){
  ctx.fillStyle = 'rgba(10,11,13,.08)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#3b82f6';
  ctx.font = '14px monospace';
  drops.forEach((y,i)=>{
    ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
    if(y*16 > H && Math.random() > .975) drops[i]=0;
    drops[i]++;
  });
}
setInterval(matrixLoop, 55);
addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});

// ===== STATE ======
let ME = null;
let CURRENT_COMPANY = null;
const socket = io();

// ===== VERIFY ======
document.getElementById('verifyBtn').onclick = async () => {
  const btn = document.getElementById('verifyBtn');
  if (btn.classList.contains('done')) return;
  btn.classList.add('done');
  btn.querySelector('span:last-child').textContent = 'Doğrulandı ✓';
  await new Promise(r=>setTimeout(r,700));
  const name = 'Kullanıcı' + Math.floor(Math.random()*9999);
  const r = await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const d = await r.json();
  ME = d.user;
  document.getElementById('meLabel').textContent = ME.name;
  document.getElementById('verify').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  socket.emit('join-user', ME.id);
  loadCompanies();
};

// ===== COMPANIES ======
async function loadCompanies(){
  const r = await fetch('/api/companies');
  const list = await r.json();
  const grid = document.getElementById('companyGrid');
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = `<div style="color:var(--sub);font-size:13px">Henüz şirket yok. İlk şirketi oluştur!</div>
      <button class="btn-join" style="padding:10px;border-radius:8px;width:100%" onclick="createCompany()">+ Şirket Oluştur</button>`;
    return;
  }
  list.forEach(c=>{
    const isOwner = c.owner === ME.id;
    const isMember = c.members.includes(ME.id);
    const card = document.createElement('div');
    card.className = 'card';
    let btns = '';
    if(!isOwner && !isMember) btns += `<button class="btn btn-attack" onclick="openAttack('${c.id}')" style="margin-bottom:8px">ŞİRKET'E SIZ</button>`;
    if(!isOwner && !isMember) btns += `<button class="btn btn-join" onclick="joinCompany('${c.id}')">ŞİRKET'E KATIL</button>`;
    card.innerHTML = `
      <h3>${c.name}</h3>
      <div class="meta">Üye: ${c.members.length} · Sahip: ${c.owner===ME.id?'Sen':'Başka'}</div>
      ${btns || '<div style="color:var(--sub);font-size:12px">Üyesin</div>'}
      ${isOwner ? `<div class="dots" onclick="toggleDots(event,'${c.id}')">⋮</div>
        <div class="dots-menu" id="dots-${c.id}"></div>` : ''}
    `;
    card.onclick = (e)=>{ if(e.target.closest('button')||e.target.closest('.dots')) return; openCompany(c.id); };
    grid.appendChild(card);
  });
}

async function createCompany(){
  const name = prompt('Şirket adı:');
  if(!name) return;
  await fetch('/api/company/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:ME.id,name})});
  loadCompanies();
}

// ===== ATTACK ======
let attackCompany = null;
function openAttack(id){
  attackCompany = id;
  const overlay = document.getElementById('attack');
  overlay.classList.add('show');
  document.getElementById('attackMenu').style.display = 'block';
  document.getElementById('attackResult').className = 'result';
  document.getElementById('attackMatrix').innerHTML = '';
}
function runAttack(){
  document.getElementById('attackMenu').style.display = 'none';
  const m = document.getElementById('attackMatrix');
  m.innerHTML = '';
  // 300 farklı yazı yağmuru
  for(let i=0;i<300;i++){
    const s = document.createElement('span');
    s.textContent = Math.random().toString(2).slice(2,12) + ' ' + ['PASS','FAIL','TRY','EXEC','HACK','SIZ','ROOT','ADMIN','SHARE','TAPU'][Math.floor(Math.random()*10)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (Math.random()*2+1) + 's';
    s.style.animationDelay = (Math.random()*1.5) + 's';
    s.style.color = Math.random()>.85 ? '#ef4444' : (Math.random()>.5?'#0f0':'#22c55e');
    m.appendChild(s);
  }
  // dit dit dit sesi
  let dits = 0;
  const dit = setInterval(()=>{
    beep();
    if(++dits > 12) clearInterval(dit);
  }, 220);

  setTimeout(async ()=>{
    clearInterval(dit);
    const r = await fetch('/api/attack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:ME.id,companyId:attackCompany})});
    const d = await r.json();
    const res = document.getElementById('attackResult');
    const title = document.getElementById('arTitle');
    const msg = document.getElementById('arMsg');
    if(d.success){
      res.className = 'result show green';
      title.textContent = 'Pass Found!';
      msg.textContent = 'The attack was successful. Hisseler ele geçirildi.';
    }else{
      res.className = 'result show red';
      title.textContent = 'Pass not found';
      msg.textContent = 'The attack failed.';
    }
    loadCompanies();
  }, 1600);
}
function closeAttack(){
  document.getElementById('attack').classList.remove('show');
  loadCompanies();
}
// beep
let ac;
function beep(){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; o.type = 'square';
    g.gain.setValueAtTime(.05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+.08);
    o.start(); o.stop(ac.currentTime+.09);
  }catch(e){}
}

// ===== JOIN ======
async function joinCompany(id){
  const r = await fetch('/api/company/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:ME.id,companyId:id})});
  const d = await r.json();
  showNotif(d.ok ? 'green' : 'red', d.ok ? 'İstek gönderildi. Sahibin onayı bekleniyor.' : (d.msg||'İstek gönderilemedi'));
}
socket.on('join-response', ({accepted})=>{
  if(accepted) showNotif('green','Tebrikler. Şirket\'e katılma istediğiniz onaylandı!.');
  else showNotif('red','Üzgünüz. Şirket\'e katılma istediğiniz reddedildi.');
  loadCompanies();
});
socket.on('join-request', ({companyId})=>{
  refreshDots(companyId);
});
socket.on('chat-error', d=> showNotif('red', d.msg));
socket.on('chat-message', m=>{
  if(!CURRENT_COMPANY) return;
  const box = document.getElementById('chatMsgs');
  const el = document.createElement('div');
  el.className = 'msg';
  el.innerHTML = `<b>${m.name}:</b>${escapeHtml(m.text)}`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
});

// ===== DOTS MENU ======
async function toggleDots(e, id){
  e.stopPropagation();
  const menu = document.getElementById('dots-'+id);
  if(menu.classList.contains('show')){ menu.classList.remove('show'); return; }
  // istekleri çek
  const r = await fetch('/api/companies');
  const list = await r.json();
  const c = list.find(x=>x.id===id);
  if(!c){ return; }
  menu.innerHTML = '<div style="font-size:11px;color:var(--sub);padding:6px 10px">Katılma İstekleri</div>';
  if(!c.joinRequests || !c.joinRequests.length){
    menu.innerHTML += '<div style="font-size:12px;color:var(--sub);padding:6px 10px">İstek yok</div>';
  } else {
    c.joinRequests.forEach(uid=>{
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:4px;padding:4px';
      row.innerHTML = `
        <button class="accept" style="flex:1" onclick="respondJoin('${id}','${uid}',true)">Kabul</button>
        <button class="reject" style="flex:1" onclick="respondJoin('${id}','${uid}',false)">Reddet</button>
      `;
      menu.appendChild(row);
    });
  }
  menu.classList.add('show');
  document.addEventListener('click', ()=>menu.classList.remove('show'), {once:true});
}

async function respondJoin(companyId, userId, accept){
  await fetch('/api/company/join/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ownerId:ME.id,companyId,userId,accept})});
  showNotif(accept?'green':'red', accept?'İstek onaylandı.':'İstek reddedildi.');
  loadCompanies();
}
function refreshDots(){ loadCompanies(); }

// ===== COMPANY VIEW ======
async function openCompany(id){
  const r = await fetch('/api/companies');
  const list = await r.json();
  const c = list.find(x=>x.id===id);
  if(!c) return;
  CURRENT_COMPANY = c;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('companyView').classList.remove('hidden');
  document.getElementById('companyTop').classList.add('show');
  document.getElementById('ctName').textContent = c.name;
  document.getElementById('companyDetail').innerHTML = `
    <h2 style="margin-bottom:10px">${c.name}</h2>
    <p style="color:var(--sub);font-size:13px;margin-bottom:16px">Sahip: ${c.owner===ME.id?'Sen':c.owner} · Üye: ${c.members.length}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px">
        <div style="font-size:11px;color:var(--sub)">HİSSELER</div>
        <div style="font-size:20px;font-weight:700;margin-top:4px">${Object.values(c.shares).reduce((a,b)=>a+b,0)}</div>
      </div>
      <div style="flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px">
        <div style="font-size:11px;color:var(--sub)">SENETLER</div>
        <div style="font-size:20px;font-weight:700;margin-top:4px">${c.members.length}</div>
      </div>
      <div style="flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px">
        <div style="font-size:11px;color:var(--sub)">TAPULAR</div>
        <div style="font-size:20px;font-weight:700;margin-top:4px">0</div>
      </div>
    </div>
  `;
  // chat yükle
  const box = document.getElementById('chatMsgs');
  box.innerHTML = '';
  (c.chat||[]).forEach(m=>{
    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = `<b>${m.name}:</b>${escapeHtml(m.text)}`;
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
  socket.emit('join-company-room', id);
}

function backHome(){
  CURRENT_COMPANY = null;
  document.getElementById('companyView').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('companyTop').classList.remove('show');
  loadCompanies();
}

function sendChat(){
  if(!CURRENT_COMPANY) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  socket.emit('chat-message',{companyId:CURRENT_COMPANY.id,userId:ME.id,name:ME.name,text});
  input.value = '';
}

// ===== UTIL ======
function showNotif(type, text){
  const n = document.getElementById('topNotif');
  n.className = 'top-notif ' + type + ' show';
  n.textContent = text;
  setTimeout(()=>n.classList.remove('show'), 4000);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
